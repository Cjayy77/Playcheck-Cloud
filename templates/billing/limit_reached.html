{% extends "base.html" %}
{% block title %}Plan limit · Playcheck Cloud{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-20 text-center">
  <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-violet-100 dark:bg-violet-950/60 text-violet-700 dark:text-violet-300 text-xl mb-4">↑</div>
  <h1 class="text-xl font-semibold mb-2">You've hit a Free plan limit</h1>
  <p class="text-sm text-zinc-500 dark:text-zinc-400 mb-6">{{ message }}</p>
  <a href="{% url 'org-billing' org.slug %}" class="inline-block rounded-md bg-violet-600 hover:bg-violet-700 text-white text-sm font-medium px-4 py-2 transition-colors">See plans &amp; upgrade</a>
  <a href="{% url 'dashboard' %}" class="block mt-3 text-sm text-zinc-500 dark:text-zinc-400 hover:underline">Back to dashboard</a>
</div>
{% endblock %}
