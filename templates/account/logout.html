{% extends "base.html" %}
{% block title %}Sign out · Playcheck Cloud{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-20 text-center">
  <h1 class="text-xl font-semibold mb-2">Sign out?</h1>
  <p class="text-sm text-zinc-500 dark:text-zinc-400 mb-6">You can sign back in with GitHub at any time.</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button type="submit" class="rounded-md bg-violet-600 hover:bg-violet-700 text-white text-sm font-medium px-4 py-2 transition-colors">Sign out</button>
    <a href="/" class="ml-2 text-sm text-zinc-500 dark:text-zinc-400 hover:underline">Cancel</a>
  </form>
</div>
{% endblock %}
