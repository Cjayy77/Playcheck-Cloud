{% extends "base.html" %}
{% block title %}New project · {{ org.name }} · Playcheck Cloud{% endblock %}
{% block content %}
<div class="max-w-lg">
  <h1 class="text-xl font-semibold mb-4">New project in {{ org.name }}</h1>
  {% if error %}
    <div class="mb-4 rounded-md border border-red-300 dark:border-red-800 bg-red-50 dark:bg-red-950/40 text-red-800 dark:text-red-300 px-4 py-2.5 text-sm">{{ error }}</div>
  {% endif %}
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label for="name" class="block text-sm font-medium mb-1">Project name</label>
      <input type="text" name="name" id="name" required autofocus
             placeholder="e.g. infra-playbooks"
             class="w-full rounded-md border border-zinc-300 dark:border-zinc-700 bg-white dark:bg-[#0d1117] px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
      <p class="mt-1 text-xs text-zinc-500 dark:text-zinc-400">Usually the repository the playbooks live in.</p>
    </div>
    <button type="submit" class="rounded-md bg-violet-600 hover:bg-violet-700 text-white text-sm font-medium px-4 py-2 transition-colors">
      Create project &amp; get upload token
    </button>
  </form>
</div>
{% endblock %}
